
# ==============================================================================
# Carto NG — Exporter Configuration (for Bash-first orchestration)
# ------------------------------------------------------------------------------
# Purpose:
#   Central configuration for Illumio PCE exports via 'workloader' CLI,
#   driven by the Python orchestrator. Values from this file are injected
#   into the environment of Bash scripts (bin/workloader_*.sh).
#
# Notes:
#   - Paths must be absolute for reliability.
#   - Time windows are passed via orchestrator args (--days) and translated
#     into start/end (YYYY-mm-dd). Files are written under EXPORT_ROOT.
#   - Throttling (post-attempt orange pause, post-success yellow pause) and
#     retries with backoff are implemented in Bash. Per-attempt timeout is
#     enforced if 'timeout' is available on the host.
# ==============================================================================

# --- Executable paths ---
# Absolute path to the Illumio 'workloader' binary.
EXECUTABLE=/home/cx232293/work/WORKLOADER/workloader

# Absolute path to the workloader YAML config (Illumio PCE credentials/endpoints).
EXECUTABLE_CONFIG_FILE=/home/cx232293/work/WORKLOADER/pce.yaml

# Logical PCE name (optional). If set, Bash scripts inject '--pce ${PCE_NAME}'.
PCE_NAME=pce-prod

# --- Output location & naming ---
# Root folder where each run's subfolders are created (raw/derived/excel).
EXPORT_ROOT=./RUNS

# Timestamp format for run folders (strftime). Typical: %Y%m%d-%H%M%S
DATE_FMT=%Y%m%d-%H%M%S

# --- Retry / Backoff policy (Bash) ---
# Maximum number of attempts for "retry_backoff" (workloader_common.sh).
RETRY_MAX_ATTEMPTS=3

# Base sleep (seconds) before backoff computation (e.g., 3).
RETRY_BASE_SLEEP=3

# Backoff factor (e.g., 2 → 3, 6, 12, 24, 48 ... up to RETRY_MAX_SLEEP).
RETRY_BACKOFF_FACTOR=2

# Maximum sleep (seconds) between retries (upper bound for backoff).
RETRY_MAX_SLEEP=60

# Jitter percentage applied to computed wait (helps desynchronize parallel calls).
RETRY_JITTER_PCT=20

# Informational only (may be used in Summary): total planned steps in pipeline.
TOTAL_STEPS=25

# --- Per-attempt timeout & max attempts (Bash) ---
# Timeout for each attempt (seconds). If 'timeout' is installed, attempts are
# terminated after this delay (exit code 124) and retried according to backoff.
TIMEOUT_SEC=2700

# Hard stop: maximum attempts in 'retry_backoff' loop (overrides per-command defaults).
MAX_ATTEMPTS=5

